<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recall</title>
  </head>
  <body>
    <main id="app">
      <header class="app-header">
        <h1>Recall</h1>
        <a href="/progress.html">Публичная страница прогресса</a>
      </header>

      <p id="status" role="status" aria-live="polite"></p>

      <form id="token-form" hidden>
        <input
          name="token"
          type="password"
          placeholder="Токен доступа"
          aria-label="Токен доступа"
          required
        />
        <button type="submit">Войти</button>
      </form>

      <section id="stats" aria-label="Статистика">
        <span data-stat="due_today">сегодня: …</span>
        <span data-stat="due_week">за неделю: …</span>
        <span data-stat="streak">серия: …</span>
      </section>

      <section aria-label="Заметки">
        <h2>Заметки</h2>
        <form id="note-form">
          <input
            name="title"
            placeholder="Заголовок"
            aria-label="Заголовок заметки"
            required
          />
          <input
            name="tags"
            placeholder="теги через запятую"
            aria-label="Теги через запятую"
          />
          <textarea
            name="body"
            placeholder="Текст заметки"
            aria-label="Текст заметки"
          ></textarea>
          <button type="submit">Добавить заметку</button>
        </form>
        <p id="tag-filter" hidden>
          Только с тегом <strong id="tag-filter-name"></strong>
          <button type="button" id="tag-filter-reset">показать все</button>
        </p>
        <ul id="note-list"></ul>
      </section>

      <section aria-label="Повторение">
        <h2>Очередь повторения</h2>
        <div id="queue"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
